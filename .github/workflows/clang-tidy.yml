name: clang-tidy

on:
  pull_request:
    paths:
      - "include/**"
      - "src/**"

permissions:
  contents: read

jobs:
  clang-tidy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            clang-18 \
            clang-tidy-18 \
            cmake \
            ninja-build \
            pkg-config \
            libasound2-dev \
            libdbus-1-dev \
            libdecor-0-dev \
            libibus-1.0-dev \
            libpipewire-0.3-dev \
            libpulse-dev \
            libssl-dev \
            libusb-1.0-0-dev \
            libwayland-dev \
            libx11-dev \
            libxkbcommon-dev

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18

      - name: Tidy sources
        env:
          CLANG_TIDY: clang-tidy-18
        run: scripts/tidy.sh

      - name: Check for changes
        run: |
          if ! git diff --exit-code; then
            echo "::error::clang-tidy changed the files above." \
              "Run scripts/tidy.sh locally and commit the result."
            exit 1
          fi
